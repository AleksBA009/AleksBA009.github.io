name: Daily Coffee Post

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install groq PyGithub requests

      - name: Generate and publish post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
        run: python generate_post.py

      - name: Commit and push any local changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Сохраняем локальные изменения во временное хранилище
          git stash
          # Подтягиваем последнюю версию из удалённого репозитория
          git pull --rebase origin main
          # Возвращаем наши изменения обратно
          git stash pop
          # Добавляем всё (topics.txt, возможно картинки в будущем)
          git add .
          # Коммитим (если есть что коммитить)
          git commit -m "Авто-обновление" || echo "Нет изменений для коммита"
          # Отправляем на GitHub
          git push origin main
